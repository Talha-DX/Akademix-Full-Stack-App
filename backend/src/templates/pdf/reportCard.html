<!-- Report card PDF — STUB template -->
<html>
  <body>
    <h1><%= studentName %> — Report Card</h1>
    <p>Class: <%= className %> · Term: <%= term %></p>
    <table>
      <thead><tr><th>Subject</th><th>Marks</th><th>Grade</th></tr></thead>
      <tbody>
        <% results.forEach((result) => { %>
          <tr><td><%= result.subject.name %></td><td><%= result.marks %>/<%= result.maxMarks %></td><td><%= result.grade %></td></tr>
        <% }) %>
      </tbody>
    </table>
  </body>
</html>
